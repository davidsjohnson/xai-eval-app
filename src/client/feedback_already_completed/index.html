<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Completed</title>
    <link rel="icon" href="data:image/x-icon;,">
    <style>
        body {
            background-color: #f4f4f4; /* Light grey background */
            font-family: Arial, sans-serif;
            color: #4CAF50; /* Green text color */
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: #ffffff; /* White background for the content box */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            margin: auto;
            margin-top: 150px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: black;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #45a049;
        }

        #hash_result {
            text-align: center;
            margin-top: 1rem;
        }
        .completion-box {
            display: inline-block;
            margin: 0.5rem auto;
            padding: 0.6rem 1rem;
            font-weight: bold;
            font-family: monospace;
            background: #f8f8f8;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s ease;
            width: fit-content;
        }

        .copy-hint {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.25rem;
            text-align: center;
        }
    </style>
   <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        const HASH_INTROS = { training_stage: 'a1c', noAI_stage: 'b55', XAI_stage1: 'z81', XAI_stage2: 'wx5' };

        function hash_participant_id(participant_id, stage, length = 15) {
            const hashText = participant_id + `supersecret_stage-${stage}`;
            const fullHash = CryptoJS.SHA256(hashText).toString(CryptoJS.enc.Hex);
            return HASH_INTROS[stage] + fullHash.slice(0, length - 3); // Truncate
        }

        function get_participant_id_from_url() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('participant_id');
        }

        function get_study_id_from_url() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('study_id');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const participant_id = get_participant_id_from_url();
            const study_id = get_study_id_from_url();
            
            let stage = "XAI_stage1"; // default
            if (study_id === "10") {
                stage = "training_stage";
            } else if (study_id === "11") {
                stage = "noAI_stage";
            } else if ((study_id.slice(-1) === "2") & (study_id.length === 3)) {
                stage = "XAI_stage2";
            }

            if (participant_id) {
                const hash = hash_participant_id(participant_id, stage);
                  document.getElementById("hash_result").innerHTML = `
                    Task Completion Code:
                    <div class="completion-box" id="completionBox">${hash}</div>
                    <small class="copy-hint">Click the code to copy</small>
                `;


                const box = document.getElementById("completionBox");
                box.addEventListener("click", () => {
                    navigator.clipboard.writeText(hash);
                    box.style.background = "#e7f9e7";
                    box.textContent = "Copied!";
                    setTimeout(() => {
                        box.textContent = hash;
                        box.style.background = "#f8f8f8";
                    }, 1000);
                });
            }
        });
    </script>
    </head>
 
    </script>
</head>
<body>
    <div class="container">
        <h1>Diagnoses Previously Submitted Successfully</h1>
        <p>Thank you again for your participation! Please copy the code below, 
        return to LimeSurvey, and then enter it to proceed to the next step.</p>
        <p id="hash_result">Loading completion code...</p>
        <!-- <button class="button" onclick="window.location.href='/index.html'">Back to Home</button>
        -->
    </div>
</body>
</html>
