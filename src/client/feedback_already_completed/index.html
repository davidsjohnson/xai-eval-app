<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Completed</title>
    <link rel="icon" href="data:image/x-icon;,">
    <style>
        body {
            background-color: #f4f4f4; /* Light grey background */
            font-family: Arial, sans-serif;
            color: #4CAF50; /* Green text color */
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: #ffffff; /* White background for the content box */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            margin: auto;
            margin-top: 150px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: black;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #45a049;
        }

        #hash_result {
            text-align: center;
            margin-top: 1rem;
        }
        .completion-box {
            display: inline-block;
            margin: 0.5rem auto;
            padding: 0.6rem 1rem;
            font-weight: bold;
            font-family: monospace;
            background: #f8f8f8;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s ease;
            width: fit-content;
        }

        .copy-hint {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.25rem;
            text-align: center;
        }
    </style>
   <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
    const HASH_INTROS = {
        training_stage: 'a1c',
        noAI_stage: 'b55',
        XAI_stage1: 'z81',
        XAI_stage2: 'wx5'
    };

    function showError(msg) {
        console.error(msg);

        const existing = document.getElementById('seq-error-box');
        if (existing) {
            existing.remove();
        }

        const box = document.createElement('div');
        box.id = 'seq-error-box';
        box.style.maxWidth = '700px';
        box.style.margin = '20px auto';
        box.style.padding = '16px 20px';
        box.style.border = '1px solid #d9a3a3';
        box.style.borderLeft = '4px solid #b00020';
        box.style.background = '#fff8f8';
        box.style.borderRadius = '6px';
        box.style.color = '#333';
        box.style.fontSize = '16px';
        box.style.lineHeight = '1.5';

        const title = document.createElement('div');
        title.textContent = 'We encoutered a problem.';
        title.style.fontWeight = 'bold';
        title.style.marginBottom = '8px';
        title.style.color = '#7a0015';

        const message = document.createElement('div');
        message.textContent = msg;
        message.style.marginBottom = '8px';

        const help = document.createElement('div');
        help.textContent = 'Unfortunately, we could not load your study condition. Please contact the researcher via Prolific with the contents of this error message.';

        box.appendChild(title);
        box.appendChild(message);
        box.appendChild(help);

        const target = document.body;

        target.prepend(box);
    }

    function hash_participant_id(participant_id, stage, length = 15) {
        const hashText = participant_id + `supersecret_stage-${stage}`;
        const fullHash = CryptoJS.SHA256(hashText).toString(CryptoJS.enc.Hex);
        return HASH_INTROS[stage] + fullHash.slice(0, length - 3);
    }

    function getUrlParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    async function getDataSeq(participant_id) {
        const JSON_URL = 'https://www.hcxai-group.de/share/seq_lookup.json';

        try {
            const response = await fetch(JSON_URL, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            return data[participant_id]?.dataseq ?? null;
        } catch (error) {
            console.error("Error fetching seq lookup:", error);
            return null;
        }
    }

    async function determineStage(study_id, participant_id) {
        if (study_id === "10") return "training_stage";
        if (study_id === "11") return "noAI_stage";

        if (study_id?.length === 3) {

            const dataseq = await getDataSeq(participant_id);
            if (!dataseq) {
                showError(`No dataseq assignment found for participant ID: ${participant_id}`);
                return;
            }

            const last = study_id.slice(-1);
            if ((dataseq === "a" && last === "2") || (dataseq === "b" && last === "1")) {
                return "XAI_stage2";
            } else if ((dataseq === "a" && last === "1") || (dataseq === "b" && last === "2")) {
                return "XAI_stage1";
            }
            showError(`Data sequence ${dataseq} is not valid for study ID: ${study_id} and participant ID: ${participant_id}`);
            return null;
        }

        showError(`Invalid Study ID: ${study_id} for participant ID: ${participant_id}`);
        return null;
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const participant_id = getUrlParam("participant_id");
        const study_id = getUrlParam("study_id");

        if (!participant_id) {
            showError("Missing participant_id in URL.");
            return;
        }

        const stage = await determineStage(study_id, participant_id);
        if (!stage) return;
        const hash = hash_participant_id(participant_id, stage);

        document.getElementById("hash_result").innerHTML = `
            Task Completion Code:
            <div class="completion-box" id="completionBox">${hash}</div>
            <small class="copy-hint">Click the code to copy</small>
        `;

        const box = document.getElementById("completionBox");
        box.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(hash);
                box.style.background = "#e7f9e7";
                box.textContent = "Copied!";
                setTimeout(() => {
                    box.textContent = hash;
                    box.style.background = "#f8f8f8";
                }, 1000);
            } catch (err) {
                console.error("Clipboard copy failed:", err);
            }
        });
    });
</script>
    </head>
 
    </script>
</head>
<body>
    <div class="container">
        <h1>Diagnoses Previously Submitted Successfully</h1>
        <p>Thank you again for your participation! Please copy the code below, 
        return to LimeSurvey, and then enter it to proceed to the next step.</p>
        <p id="hash_result">Loading completion code...</p>
        <!-- <button class="button" onclick="window.location.href='/index.html'">Back to Home</button>
        -->
    </div>
</body>
</html>
